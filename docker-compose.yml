services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CLIENT_ORIGIN=http://localhost:3000
    volumes:
      - sqlite_data:/app/data

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:4000/api/tasks
        - VITE_WS_URL=ws://localhost:4000/ws
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  sqlite_data: